<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Harvester Car</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a0a00;font-family:'Nunito',sans-serif}
canvas{display:block}

#hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 22px;
  background:linear-gradient(180deg,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0) 100%);
  pointer-events:none;z-index:50;
}
.hpill{
  background:rgba(0,0,0,0.55);
  border:1.5px solid rgba(255,255,255,0.18);
  border-radius:40px;padding:6px 18px;
  display:flex;align-items:center;gap:8px;
  backdrop-filter:blur(6px);
}
.hlabel{font-size:11px;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:1px}
.hval{font-family:'Fredoka One',cursive;font-size:22px;color:#FFD700;line-height:1}
.htitle{font-family:'Fredoka One',cursive;font-size:22px;color:#fff;text-shadow:0 0 20px rgba(255,200,50,0.8)}

/* Speedometer */
#speedo{
  position:fixed;bottom:24px;right:24px;
  width:130px;height:130px;
  background:rgba(0,0,0,0.6);
  border:2px solid rgba(255,255,255,0.15);
  border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;backdrop-filter:blur(8px);
}
#speedo canvas{position:absolute;top:0;left:0}
#speed-num{font-family:'Fredoka One',cursive;font-size:32px;color:#fff;position:relative;z-index:2;line-height:1}
#speed-unit{font-size:11px;color:rgba(255,255,255,0.5);position:relative;z-index:2;letter-spacing:1px}

/* Gear indicator */
#gear-box{
  position:fixed;bottom:24px;right:168px;
  background:rgba(0,0,0,0.6);border:1.5px solid rgba(255,255,255,0.15);
  border-radius:16px;padding:10px 16px;z-index:50;backdrop-filter:blur(8px);
  text-align:center;
}
#gear-val{font-family:'Fredoka One',cursive;font-size:36px;color:#FF6B35;line-height:1}
.gear-label{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase}

/* Controls hint */
#hints{
  position:fixed;bottom:24px;left:24px;
  background:rgba(0,0,0,0.55);border:1.5px solid rgba(255,255,255,0.12);
  border-radius:14px;padding:12px 16px;z-index:50;backdrop-filter:blur(6px);
  font-size:12px;color:rgba(255,255,255,0.6);line-height:2;
}
#hints b{color:#FFD700}

/* Boost bar */
#boost-bar-wrap{
  position:fixed;bottom:170px;right:30px;
  width:12px;height:120px;
  background:rgba(255,255,255,0.08);border-radius:8px;
  border:1px solid rgba(255,255,255,0.15);
  overflow:hidden;z-index:50;
}
#boost-bar-fill{
  position:absolute;bottom:0;width:100%;
  background:linear-gradient(to top,#FF4500,#FFD700);
  border-radius:8px;transition:height .05s;
}
.boost-label{
  position:fixed;bottom:296px;right:12px;
  font-size:10px;color:rgba(255,255,255,0.4);
  letter-spacing:1.5px;writing-mode:vertical-rl;
  text-orientation:mixed;z-index:50;transform:rotate(180deg);
}

/* Popup message */
#msg{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);
  font-family:'Fredoka One',cursive;font-size:20px;color:#FFD700;
  text-shadow:0 2px 12px rgba(0,0,0,0.8);
  pointer-events:none;z-index:200;
  opacity:0;transition:opacity .2s;
}
#msg.show{opacity:1}

/* Collect flash */
.cpop{
  position:fixed;font-family:'Fredoka One',cursive;font-size:24px;
  color:#FFD700;text-shadow:0 2px 8px rgba(0,0,0,0.6);
  pointer-events:none;z-index:300;
  animation:cpopAnim .9s ease-out forwards;
}
@keyframes cpopAnim{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-70px) scale(1.2)}
}

/* Overlay */
#overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.75);
  display:flex;align-items:center;justify-content:center;
  z-index:400;backdrop-filter:blur(10px);
}
#obox{
  background:linear-gradient(160deg,#1a0f00,#2a1800);
  border:2px solid rgba(255,200,50,0.4);
  border-radius:28px;padding:44px 54px;text-align:center;max-width:440px;width:90%;
  box-shadow:0 0 60px rgba(255,150,0,0.2);
}
#otitle{font-family:'Fredoka One',cursive;font-size:44px;color:#FFD700;margin-bottom:8px}
#osub{font-size:15px;color:rgba(255,255,255,0.6);margin-bottom:28px;line-height:1.6}
#oscore{font-family:'Fredoka One',cursive;font-size:30px;color:#FF6B35;margin-bottom:24px;display:none}
.obtn{
  background:linear-gradient(135deg,#FF6B35,#FF4500);
  color:#fff;border:none;border-radius:50px;
  padding:16px 48px;font-family:'Fredoka One',cursive;font-size:22px;
  cursor:pointer;letter-spacing:1px;
  box-shadow:0 4px 24px rgba(255,80,0,0.4);
  transition:transform .15s,box-shadow .15s;
}
.obtn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(255,80,0,0.5)}

/* Minimap */
#minimap{
  position:fixed;top:70px;right:16px;
  width:100px;height:100px;
  background:rgba(0,0,0,0.55);
  border:1.5px solid rgba(255,255,255,0.15);
  border-radius:12px;overflow:hidden;z-index:50;
  backdrop-filter:blur(4px);
}
#minimap canvas{width:100%;height:100%}
#mobileControls{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  z-index:999;
}

#mobileControls button{
  width:70px;
  height:70px;
  font-size:28px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,0.6);
  color:white;
  backdrop-filter:blur(5px);
}
</style>
</head>

<div id="overlay">
  <div id="obox">
    <div id="otitle">🚗<br>Harvest Rush!</div>
    <div id="osub">Open World tanpa batas!<br>Kumpulkan hasil panen sebanyak mungkin.<br>Kecepatan lebih tinggi = poin lebih besar!</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

// ═══════════════════════════════════════════════════════════
// SCENE
// ═══════════════════════════════════════════════════════════
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.FogExp2(0xB8D8FF,0.007);

// ═══════════════════════════════════════════════════════════
// CAMERAS
// ═══════════════════════════════════════════════════════════
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,600);
let camMode=0; // 0=chase, 1=hood, 2=bird
camera.position.set(0,5,12);

// ═══════════════════════════════════════════════════════════
// LIGHTS
// ═══════════════════════════════════════════════════════════
const sun=new THREE.DirectionalLight(0xFFF5E0,2.8);
sun.position.set(80,120,60);
sun.castShadow=true;
sun.shadow.mapSize.setScalar(4096);
sun.shadow.camera.near=0.5;
sun.shadow.camera.far=300;
sun.shadow.camera.left=sun.shadow.camera.bottom=-80;
sun.shadow.camera.right=sun.shadow.camera.top=80;
sun.shadow.bias=-0.0005;
scene.add(sun);

scene.add(new THREE.AmbientLight(0xB0CFFF,0.9));
scene.add(new THREE.HemisphereLight(0x87CEEB,0x7EC850,0.7));

// fill light for car
const fillLight=new THREE.PointLight(0xFFFFFF,0.6,20);
scene.add(fillLight);

// ═══════════════════════════════════════════════════════════
// INFINITE TERRAIN (chunked, world-space)
// ═══════════════════════════════════════════════════════════
const CHUNK=60;       // chunk size in world units
const VDIST=4;        // visible chunk radius
const chunks=new Map();

const groundMat=new THREE.MeshLambertMaterial({color:0x7EC850});
const grassMat=new THREE.MeshLambertMaterial({color:0x5DB847});

// Road materials — multi-lane highway
const roadMat=new THREE.MeshLambertMaterial({color:0x3A3A3A});
const roadLineMat=new THREE.MeshLambertMaterial({color:0xFFFFFF});
const roadYellowMat=new THREE.MeshLambertMaterial({color:0xFFCC00});
const sidewalkMat=new THREE.MeshLambertMaterial({color:0xCCBFA0});
const curbMat=new THREE.MeshLambertMaterial({color:0xAAAAAA});

function getChunkKey(cx,cz){return `${cx},${cz}`}

function makeChunk(cx,cz){
  const key=getChunkKey(cx,cz);
  if(chunks.has(key))return;

  const ox=cx*CHUNK, oz=cz*CHUNK;
  const grp=new THREE.Group();
  grp.position.set(ox,0,oz);

  // Ground tile
  const g=new THREE.Mesh(new THREE.PlaneGeometry(CHUNK,CHUNK,1,1),groundMat);
  g.rotation.x=-Math.PI/2; g.receiveShadow=true;
  grp.add(g);

  // Road (centered on world Z axis — runs along X=0 strip)
  // Road width: 14 units (4 lanes)
  const roadW=14, sidewalkW=2;
  if(Math.abs(ox)<=CHUNK/2){
    // sidewalks
    [-1,1].forEach(side=>{
      const sw=new THREE.Mesh(new THREE.PlaneGeometry(sidewalkW,CHUNK),sidewalkMat);
      sw.rotation.x=-Math.PI/2; sw.position.set(side*(roadW/2+sidewalkW/2),0.02,0);
      sw.receiveShadow=true; grp.add(sw);
      // curb
      const curb=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.14,CHUNK),curbMat);
      curb.position.set(side*(roadW/2+0.125),0.07,0); curb.castShadow=true;
      grp.add(curb);
    });
    // asphalt
    const road=new THREE.Mesh(new THREE.PlaneGeometry(roadW,CHUNK),roadMat);
    road.rotation.x=-Math.PI/2; road.position.y=0.01; road.receiveShadow=true;
    grp.add(road);
    // center double yellow
    [-0.18,0.18].forEach(dx=>{
      const cl=new THREE.Mesh(new THREE.PlaneGeometry(0.12,CHUNK),roadYellowMat);
      cl.rotation.x=-Math.PI/2; cl.position.set(dx,0.02,0); grp.add(cl);
    });
    // lane dashes — left 2 lanes
    [-3.5, 3.5].forEach(lx=>{
      for(let dz=-CHUNK/2;dz<CHUNK/2;dz+=8){
        const d=new THREE.Mesh(new THREE.PlaneGeometry(0.14,4),roadLineMat);
        d.rotation.x=-Math.PI/2; d.position.set(lx,0.02,dz); grp.add(d);
      }
    });
    // shoulder lines
    [-6.8, 6.8].forEach(lx=>{
      const sl=new THREE.Mesh(new THREE.PlaneGeometry(0.14,CHUNK),roadLineMat);
      sl.rotation.x=-Math.PI/2; sl.position.set(lx,0.02,0); grp.add(sl);
    });
  }

  // Scatter: trees, rocks, flowers — avoid road zone
  const rng=(s)=>{let x=Math.sin(s)*10000;return x-Math.floor(x)};
  const seed=cx*1000+cz;
  for(let i=0;i<18;i++){
    const lx=(rng(seed+i*7+1)-0.5)*CHUNK;
    const lz=(rng(seed+i*7+2)-0.5)*CHUNK;
    if(Math.abs(lx+ox)<9)continue; // skip road
    const t=Math.floor(rng(seed+i*7+3)*3);
    if(t===0) grp.add(makeTree(lx,lz,0.7+rng(seed+i*7+4)*0.7,seed+i));
    else if(t===1) grp.add(makeRock(lx,lz));
    else grp.add(makeFlower(lx,lz,seed+i));
  }

  // Farmhouses & barns at certain chunks
  if((cx+cz)%5===0 && cx!==0){
    const side=(cx>0?1:-1);
    grp.add(makeFarmhouse(side*(roadW/2+10),rng(seed)*20-10, seed));
  }
  if((cx+cz)%7===2){
    grp.add(makeWindmill((rng(seed+99)-0.5)*CHUNK*0.6, (rng(seed+88)-0.5)*CHUNK*0.6));
  }

  // Street lights every chunk along road
  if(Math.abs(ox)<=CHUNK/2){
    [-1,1].forEach(side=>{
      for(let lz=-CHUNK/2+10;lz<CHUNK/2;lz+=20){
        grp.add(makeStreetLight(side*9,lz));
      }
    });
  }

  scene.add(grp);
  chunks.set(key,grp);
}

function updateChunks(px,pz){
  const cx=Math.round(px/CHUNK), cz=Math.round(pz/CHUNK);
  for(let dx=-VDIST;dx<=VDIST;dx++){
    for(let dz=-VDIST;dz<=VDIST;dz++){
      makeChunk(cx+dx,cz+dz);
    }
  }
  // Remove far chunks
  for(const [key,grp] of chunks){
    const [kcx,kcz]=key.split(',').map(Number);
    if(Math.abs(kcx-cx)>VDIST+1||Math.abs(kcz-cz)>VDIST+1){
      scene.remove(grp);
      grp.traverse(c=>{if(c.geometry)c.geometry.dispose()});
      chunks.delete(key);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// ENVIRONMENT OBJECTS
// ═══════════════════════════════════════════════════════════
const treeMats=[
  new THREE.MeshLambertMaterial({color:0x2E7D32}),
  new THREE.MeshLambertMaterial({color:0x388E3C}),
  new THREE.MeshLambertMaterial({color:0x1B5E20}),
  new THREE.MeshLambertMaterial({color:0x558B2F}),
];
const trunkMat=new THREE.MeshLambertMaterial({color:0x6D4C41});

function makeTree(lx,lz,sc,sd){
  const g=new THREE.Group();
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.18*sc,0.28*sc,2.0*sc,7),trunkMat);
  tr.position.y=sc; tr.castShadow=true; g.add(tr);
  const lm=treeMats[Math.floor(Math.sin(sd)*treeMats.length+treeMats.length)%treeMats.length];
  [[0,3.2*sc,0,1.1*sc],[0,4.2*sc,0,0.85*sc],[0,5.0*sc,0,0.6*sc]].forEach(([x,y,z,r])=>{
    const lv=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),lm);
    lv.position.set(x,y,z); lv.castShadow=true; g.add(lv);
  });
  g.position.set(lx,0,lz);
  g.userData={isObs:true,r:0.5*sc};
  return g;
}

function makeRock(lx,lz){
  const g=new THREE.Group();
  const rm=new THREE.MeshLambertMaterial({color:0x9E9E9E});
  [[0,0.28,0,0.36],[0.28,0.22,-0.1,0.26],[-0.22,0.18,0.1,0.22]].forEach(([x,y,z,r])=>{
    const rk=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),rm);
    rk.scale.y=0.6; rk.position.set(x,y,z); rk.castShadow=true; g.add(rk);
  });
  g.position.set(lx,0,lz);
  g.userData={isObs:true,r:0.5};
  return g;
}

function makeFlower(lx,lz,sd){
  const g=new THREE.Group();
  const colors=[0xFFD700,0xFF6B35,0xE53935,0x9C27B0,0xFF80AB];
  const c=colors[Math.abs(Math.floor(Math.sin(sd)*100))%colors.length];
  const sm=new THREE.MeshLambertMaterial({color:0x4CAF50});
  const fm=new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:0.15});
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,0.7,5),sm);
  st.position.y=0.35; g.add(st);
  const fl=new THREE.Mesh(new THREE.SphereGeometry(0.2,7,6),fm);
  fl.position.y=0.8; g.add(fl);
  g.position.set(lx,0,lz);
  return g;
}

function makeFarmhouse(lx,lz,sd){
  const g=new THREE.Group();
  const wallM=new THREE.MeshLambertMaterial({color:0xFFECB3});
  const roofM=new THREE.MeshLambertMaterial({color:sd%2===0?0xB71C1C:0x4E342E});
  const w=new THREE.Mesh(new THREE.BoxGeometry(7,4.5,6),wallM);
  w.position.y=2.25; w.castShadow=true; g.add(w);
  const r=new THREE.Mesh(new THREE.ConeGeometry(5.5,3.5,4),roofM);
  r.position.y=6; r.rotation.y=Math.PI/4; r.castShadow=true; g.add(r);
  const dM=new THREE.MeshLambertMaterial({color:0x8D6E63});
  const d=new THREE.Mesh(new THREE.BoxGeometry(1,2.2,0.15),dM);
  d.position.set(0,1.1,3.08); g.add(d);
  const wM=new THREE.MeshLambertMaterial({color:0xB3E5FC,emissive:0xFFFF99,emissiveIntensity:0.2});
  [-2,2].forEach(wx=>{
    const wn=new THREE.Mesh(new THREE.BoxGeometry(1.1,1,0.1),wM);
    wn.position.set(wx,2.5,3.08); g.add(wn);
  });
  const ch=new THREE.Mesh(new THREE.BoxGeometry(0.6,2,0.6),new THREE.MeshLambertMaterial({color:0x9E9E9E}));
  ch.position.set(2,7,0); g.add(ch);
  g.position.set(lx,0,lz);
  return g;
}

function makeWindmill(lx,lz){
  const g=new THREE.Group();
  const tw=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.7,8,10),new THREE.MeshLambertMaterial({color:0xEEEEEE}));
  tw.position.y=4; tw.castShadow=true; g.add(tw);
  const hub=new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8),new THREE.MeshLambertMaterial({color:0xCCCCCC}));
  hub.position.y=8; g.add(hub);
  const bladeGrp=new THREE.Group();
  bladeGrp.position.y=8;
  const bladeM=new THREE.MeshLambertMaterial({color:0xE0E0E0});
  for(let i=0;i<4;i++){
    const b=new THREE.Mesh(new THREE.BoxGeometry(0.35,3.5,0.12),bladeM);
    b.position.y=1.75; b.castShadow=true;
    const p=new THREE.Group();
    p.rotation.z=(i/4)*Math.PI*2;
    p.add(b); bladeGrp.add(p);
  }
  g.add(bladeGrp);
  g.userData.bladeGrp=bladeGrp;
  g.position.set(lx,0,lz);
  return g;
}

function makeStreetLight(lx,lz){
  const g=new THREE.Group();
  const pm=new THREE.MeshLambertMaterial({color:0x888888});
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,6,6),pm);
  pole.position.y=3; pole.castShadow=true; g.add(pole);
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,2.2,5),pm);
  arm.position.set(0,6,0); arm.rotation.x=Math.PI/2; g.add(arm);
  arm.position.z=-1.1;
  const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8),new THREE.MeshLambertMaterial({color:0xFFFF99,emissive:0xFFFF44,emissiveIntensity:0.6}));
  lamp.position.set(0,5.95,-2.2); g.add(lamp);
  // Point light for street lighting
  const pl=new THREE.PointLight(0xFFEE88,1.2,14);
  pl.position.set(0,5.8,-2.2); g.add(pl);
  g.position.set(lx,0,lz);
  return g;
}

// ═══════════════════════════════════════════════════════════
// CROPS (world-space, pooled)
// ═══════════════════════════════════════════════════════════
const cropDefs=[
  {name:'Bunga Matahari',color:0xFFD700,em:0xFFAA00,pts:10,sc:1.0},
  {name:'Jagung',        color:0xFFEB3B,em:0xFFC107,pts:15,sc:1.2},
  {name:'Stroberi',      color:0xE53935,em:0xC62828,pts:20,sc:0.9},
  {name:'Labu',          color:0xFF6D00,em:0xE65100,pts:25,sc:1.3},

const cropPool=[];
const CROP_COUNT=40;

function buildCrop(def){
  const g=new THREE.Group();
  const sm=new THREE.MeshLambertMaterial({color:0x388E3C});
  const hm=new THREE.MeshLambertMaterial({color:def.color,emissive:def.em,emissiveIntensity:0.25});
  const st=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,1.0,6),sm);
  st.position.y=0.5; g.add(st);
  const hd=new THREE.Mesh(new THREE.SphereGeometry(0.42*def.sc,10,10),hm);
  hd.position.y=1.12*def.sc; hd.castShadow=true; g.add(hd);
  // leaves
  for(let i=0;i<2;i++){
    const lf=new THREE.Mesh(new THREE.SphereGeometry(0.22,6,4),sm);
    lf.scale.set(1.4,0.35,0.9); lf.position.set(i?0.38:-0.38,0.55,0); g.add(lf);
  }
  // glow ring
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.55*def.sc,0.04,6,16),new THREE.MeshLambertMaterial({color:def.em,emissive:def.em,emissiveIntensity:0.5}));
  ring.rotation.x=Math.PI/2; ring.position.y=0.05; g.add(ring);
  g.userData={def,collected:false,r:0.6*def.sc};
  return g;
}

function placeCrop(crop){
  const angle=Math.random()*Math.PI*2;
  const dist=20+Math.random()*60;
  const px=carGrp.position.x + Math.sin(angle)*dist;
  const pz=carGrp.position.z + Math.cos(angle)*dist;
  crop.position.set(px,0,pz);
  crop.userData.collected=false;
  crop.visible=true;
}

for(let i=0;i<CROP_COUNT;i++){
  const def=cropDefs[i%cropDefs.length];
  const c=buildCrop(def);
  cropPool.push(c);
  scene.add(c);
}

function makeHDWheel(px,py,pz,flip){
  const wg=new THREE.Group();

  // Tire
  const tire=new THREE.Mesh(new THREE.TorusGeometry(0.48,0.2,16,28),tireMat);
  tire.rotation.y=Math.PI/2; tire.castShadow=true; wg.add(tire);

  // Tire sidewall detail
  for(let i=0;i<8;i++){
    const notch=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.22,0.02),rubberMat);
    const a=(i/8)*Math.PI*2;
    notch.position.set(Math.cos(a)*0.48,Math.sin(a)*0.48,flip?-0.19:0.19);
    wg.add(notch);
  }

  // Rim (disc)
  const rimDisc=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.12,20),rimMat);
  rimDisc.rotation.z=Math.PI/2; rimDisc.castShadow=true; wg.add(rimDisc);

  // Rim center cap
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.14,12),chromeMat);
  cap.rotation.z=Math.PI/2; wg.add(cap);

  // 5 spokes
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2;
    const spk=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.06,0.08),rimSpokeMat);
    spk.position.set(0,Math.sin(a)*0.22,Math.cos(a)*0.22);
    spk.rotation.x=a; wg.add(spk);
    // Spoke bolt holes
    const bolt=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.14,6),darkGrayMat);
    bolt.rotation.z=Math.PI/2; bolt.position.set(0,Math.sin(a)*0.26,Math.cos(a)*0.26);
    wg.add(bolt);
  }

  // Brake disc (inner)
  const brake=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.04,16),new THREE.MeshLambertMaterial({color:0x555555}));
  brake.rotation.z=Math.PI/2; wg.add(brake);

  // Brake caliper
  const caliper=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.2,0.15),new THREE.MeshLambertMaterial({color:0xCC0000}));
  caliper.position.set(0,-0.3,0); wg.add(caliper);

  // Lug nuts
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2;
    const ln=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.08,6),chromeMat);
    ln.rotation.z=Math.PI/2; ln.position.set(0,Math.sin(a)*0.26,Math.cos(a)*0.26);
    wg.add(ln);
  }

  wg.position.set(px,py,pz);
  if(flip) wg.rotation.z=Math.PI;
  return wg;
}

const mmCanvas=document.getElementById('mmCanvas');
const mmCtx=mmCanvas.getContext('2d');

function drawMinimap(){
  const W=200,H=200,scale=1.4;
  mmCtx.clearRect(0,0,W,H);
  mmCtx.fillStyle='rgba(20,20,20,0.7)';
  mmCtx.fillRect(0,0,W,H);
  // road strip
  mmCtx.fillStyle='#444';
  mmCtx.fillRect(W/2-8,0,16,H);
  mmCtx.fillStyle='#666';
  mmCtx.fillRect(W/2-0.5,0,1,H);
  // crops
  cropPool.forEach(c=>{
    if(c.userData.collected||!c.visible)return;
    const dx=(c.position.x-carGrp.position.x)*scale;
    const dz=(c.position.z-carGrp.position.z)*scale;
    const mx=W/2+dx, my=H/2+dz;
    if(mx<0||mx>W||my<0||my>H)return;
    mmCtx.fillStyle='#FFD700';
    mmCtx.beginPath();mmCtx.arc(mx,my,3,0,Math.PI*2);mmCtx.fill();
  });
  // car dot
  mmCtx.fillStyle='#FF3300';
  mmCtx.beginPath();mmCtx.arc(W/2,H/2,5,0,Math.PI*2);mmCtx.fill();
  mmCtx.fillStyle='#fff';
  const dx=Math.sin(carGrp.rotation.y)*7, dz=Math.cos(carGrp.rotation.y)*7;
  mmCtx.beginPath();mmCtx.moveTo(W/2+dx,H/2-dz);
  mmCtx.lineTo(W/2-dx*0.5+dz*0.5,H/2+dz*0.5+dx*0.5);
  mmCtx.lineTo(W/2-dx*0.5-dz*0.5,H/2+dz*0.5-dx*0.5);
  mmCtx.closePath();mmCtx.fill();
}

const spdoCvs=document.getElementById('speedoCanvas');
const spdoCtx=spdoCvs.getContext('2d');

function drawSpeedo(kmh){
  const W=130,H=130,cx=65,cy=65,r=52;
  spdoCtx.clearRect(0,0,W,H);
  // arc track
  spdoCtx.beginPath();
  spdoCtx.arc(cx,cy,r,Math.PI*0.75,Math.PI*2.25);
  spdoCtx.strokeStyle='rgba(255,255,255,0.1)';
  spdoCtx.lineWidth=8; spdoCtx.stroke();
  // colored arc
  const maxKmh=240;
  const frac=Math.min(kmh/maxKmh,1);
  const endA=Math.PI*0.75+(Math.PI*1.5*frac);
  const grad=spdoCtx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,'#00FF88');
  grad.addColorStop(0.5,'#FFD700');
  grad.addColorStop(1,'#FF4500');
  spdoCtx.beginPath();
  spdoCtx.arc(cx,cy,r,Math.PI*0.75,endA);
  spdoCtx.strokeStyle=grad;
  spdoCtx.lineWidth=8; spdoCtx.stroke();
  // needle
  const needleA=Math.PI*0.75+(Math.PI*1.5*frac)-Math.PI/2;
  spdoCtx.beginPath();
  spdoCtx.moveTo(cx,cy);
  spdoCtx.lineTo(cx+Math.cos(needleA)*42,cy+Math.sin(needleA)*42);
  spdoCtx.strokeStyle='#FF4500';
  spdoCtx.lineWidth=2.5; spdoCtx.stroke();
  // center dot
  spdoCtx.beginPath();
  spdoCtx.arc(cx,cy,5,0,Math.PI*2);
  spdoCtx.fillStyle='#FF4500'; spdoCtx.fill();
}

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
let gameRunning=false;
let score=0, cropsCollected=0, timeLeft=60, level=1;
let vel=0, turnRate=0;
let carRot=0;
let isBoosting=false, boostCharge=100, boostCooldown=0;
let smokeTick=0;
let totalDist=0;

const keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',  e=>keys[e.key.toLowerCase()]=false);
renderer.domElement.addEventListener('click',()=>{
  if(!gameRunning)return;
  vel=Math.max(vel,0.02); showMsg('💨 Turbo Click!');
});

let timerIv;

window.startGame=function(){
  document.getElementById('overlay').style.display='none';
  gameRunning=true;
  score=0;cropsCollected=0;timeLeft=60;level=1;vel=0;boostCharge=100;totalDist=0;
  carGrp.position.set(0,0,0); carRot=0; carGrp.rotation.y=0;
  ['hScore','hCrops','hTime','hLevel'].forEach((id,i)=>document.getElementById(id).textContent=[0,0,60,1][i]);
  cropPool.forEach(c=>placeCrop(c));
  clearInterval(timerIv);
  timerIv=setInterval(()=>{
    if(!gameRunning)return;
    timeLeft--;
    document.getElementById('hTime').textContent=timeLeft;
    if(timeLeft<=0){endGame();return;}
    if(timeLeft===40){level=2;document.getElementById('hLevel').textContent=2;showMsg('⬆ Level 2!');}
    if(timeLeft===20){level=3;document.getElementById('hLevel').textContent=3;showMsg('🔥 Level 3!');}
  },1000);
};

function endGame(){
  gameRunning=false; clearInterval(timerIv);
  document.getElementById('overlay').style.display='flex';
  document.getElementById('otitle').innerHTML='🏆 Selesai!';
  document.getElementById('osub').textContent=`${cropsCollected} tanaman dipanen!`;
  document.getElementById('oscore').style.display='block';
  document.getElementById('oscore').textContent='⭐ Skor: '+score;
  document.getElementById('.obtn'||'');
  document.querySelector('.obtn').textContent='🔄 Main Lagi!';
}

const msgEl=document.getElementById('msg');
let msgTimer;
function showMsg(t){
  msgEl.textContent=t; msgEl.classList.add('show');
  clearTimeout(msgTimer); msgTimer=setTimeout(()=>msgEl.classList.remove('show'),1800);
}

function cpop(txt,sx,sy){
  const el=document.createElement('div');
  el.className='cpop'; el.textContent=txt;
  el.style.left=sx+'px'; el.style.top=sy+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

// ═══════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
const clock=new THREE.Clock();
let windmillT=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);
  windmillT+=dt;

  // ── Physics ──
  if(gameRunning){
    const maxV= isBoosting ? 0.85 : (0.28 + level*0.05);
    const accel=0.016, friction=0.935, turnFric=0.88;

    isBoosting=(keys['shift']||keys['control'])&&boostCharge>0;
    if(isBoosting){
      boostCharge=Math.max(0,boostCharge-1.8);
    } else {
      boostCharge=Math.min(100,boostCharge+0.4);
    }
    document.getElementById('boost-bar-fill').style.height=boostCharge+'%';

    const fwd=keys['w']||keys['arrowup'];
    const bck=keys['s']||keys['arrowdown'];
    const lft=keys['a']||keys['arrowleft'];
    const rgt=keys['d']||keys['arrowright'];

    if(fwd) vel=Math.min(vel+accel*(isBoosting?2.4:1),maxV);
    else if(bck) vel=Math.max(vel-accel*0.9,-maxV*0.45);
    else vel*=friction;

    const turnStrength=Math.min(Math.abs(vel)/0.08,1)*0.045*(vel>0?1:-1);
    if(lft) turnRate+=turnStrength;
    if(rgt) turnRate-=turnStrength;
    turnRate*=turnFric;

    carRot+=turnRate;
    carGrp.rotation.y=carRot;

    const moveX=Math.sin(carRot)*vel;
    const moveZ=Math.cos(carRot)*vel;
    carGrp.position.x+=moveX;
    carGrp.position.z+=moveZ;
    totalDist+=Math.abs(vel);

    // H = klakson
    if(keys['h']){showMsg('📯 Priiiiit!');keys['h']=false;}

    // Camera switch
    if(keys['c']){camMode=(camMode+1)%3;keys['c']=false;}

    // Wheel spin
    const spinRate=vel*7;
    wRL.rotation.x+=spinRate; wRR.rotation.x+=spinRate;
    wFL.rotation.x+=spinRate; wFR.rotation.x+=spinRate;
    // Front steer visual
    const steer=turnRate*12;
    wFL.rotation.y=steer; wFR.rotation.y=steer;

    // Car body roll/pitch
    carGrp.rotation.z=THREE.MathUtils.lerp(carGrp.rotation.z,-turnRate*4,0.12);
    carGrp.rotation.x=THREE.MathUtils.lerp(carGrp.rotation.x,vel>0?-vel*0.3:vel*0.15,0.08);

    // Suspension bounce
    carGrp.position.y=Math.sin(totalDist*6)*0.018*Math.abs(vel)/0.1+0.01;

    // Brake lights
    const braking=bck&&vel>0.02;
    blL.intensity=blR.intensity=braking?2.5:0;

    // Smoke emit
    smokeTick--;
    if(smokeTick<=0&&Math.abs(vel)>0.05){
      smokeTick=isBoosting?2:6;
      emitSmoke();
    }

    // Update chunks
    updateChunks(carGrp.position.x,carGrp.position.z);

    // Crop collection
    cropPool.forEach(cr=>{
      if(cr.userData.collected||!cr.visible)return;
      const dx=cr.position.x-carGrp.position.x;
      const dz=cr.position.z-carGrp.position.z;
      const dist=Math.sqrt(dx*dx+dz*dz);
      if(dist<1.1+cr.userData.r){
        cr.userData.collected=true; cr.visible=false;
        const speedBonus=Math.floor(Math.abs(vel)/0.28*10);
        const pts=(cr.userData.def.pts+speedBonus)*level;
        score+=pts; cropsCollected++;
        document.getElementById('hScore').textContent=score;
        document.getElementById('hCrops').textContent=cropsCollected;
        const sp=cr.position.clone().project(camera);
        cpop(`+${pts} ${cr.userData.def.name}`,
          (sp.x+1)/2*innerWidth-60,(-sp.y+1)/2*innerHeight-30);
        showMsg(`✨ x${level} Speed Bonus +${speedBonus}`);
        setTimeout(()=>{if(!gameRunning)return;placeCrop(cr);},4000);
      }
    });

    // Crop bob animation
    const t=clock.getElapsedTime();
    cropPool.forEach((cr,i)=>{
      if(!cr.visible)return;
      cr.position.y=Math.sin(t*1.8+i*0.5)*0.12;
      cr.rotation.y+=0.018;
    });

    // Speedometer
    const kmh=Math.round(Math.abs(vel)*400);
    document.getElementById('speed-num').textContent=kmh;
    drawSpeedo(kmh);

    // Gear
    const gears=['R','N','1','2','3','4','5','6'];
    const gi=vel<-0.01?0:vel<0.01?1:Math.min(Math.floor(Math.abs(vel)/0.12)+2,7);
    document.getElementById('gear-val').textContent=gears[gi];

    // Fill light follows car
    fillLight.position.copy(carGrp.position).add(new THREE.Vector3(0,4,0));

    // Obstacle collision with trees (avoid road trees — none exist)
    // (trees are offroad so minimal check needed for performance)

  }

  // ── Smoke update ──
  for(let i=smokeParts.length-1;i>=0;i--){
    const sm=smokeParts[i];
    sm.userData.life-=0.025;
    sm.position.y+=sm.userData.vy;
    sm.position.x+=(Math.random()-0.5)*0.03;
    sm.material.opacity=sm.userData.life*0.55;
    sm.scale.addScalar(0.02);
    if(sm.userData.life<=0){scene.remove(sm);smokeParts.splice(i,1);}
  }

  // ── Windmills ──
  scene.traverse(o=>{
    if(o.userData.bladeGrp) o.userData.bladeGrp.rotation.z+=0.022;
  });

  // ── Clouds ──
  cloudMeshes.forEach((c,i)=>{
    c.position.x+=c.userData.speed;
    if(c.position.x>300) c.position.x=-300;
  });

  // ── Camera ──
  const cp=carGrp.position, cr=carGrp.rotation;
  if(camMode===0){
    // Chase cam — behind & above
    const behind=new THREE.Vector3(
      cp.x-Math.sin(carRot)*(5+Math.abs(vel)*8),
      cp.y+4.5+Math.abs(vel)*2,
      cp.z-Math.cos(carRot)*(5+Math.abs(vel)*8)
    );
    camera.position.lerp(behind,0.1);
    const lookAt=new THREE.Vector3(cp.x+Math.sin(carRot)*6,cp.y+0.8,cp.z+Math.cos(carRot)*6);
    camera.lookAt(lookAt);
  } else if(camMode===1){
    // Hood cam
    const hood=new THREE.Vector3(
      cp.x+Math.sin(carRot)*0.5,
      cp.y+1.4,
      cp.z+Math.cos(carRot)*0.5
    );
    camera.position.lerp(hood,0.3);
    camera.lookAt(cp.x+Math.sin(carRot)*20,cp.y+1,cp.z+Math.cos(carRot)*20);
  } else {
    // Bird eye
    camera.position.lerp(new THREE.Vector3(cp.x,cp.y+30,cp.z+8),0.08);
    camera.lookAt(cp.x,cp.y,cp.z);
  }

  // ── Minimap ──
  drawMinimap();

  renderer.render(scene,camera);
}

// Initial chunk load
for(let dx=-VDIST;dx<=VDIST;dx++)
  for(let dz=-VDIST;dz<=VDIST;dz++)
    makeChunk(dx,dz);

// Place initial crops
cropPool.forEach(c=>{
  const a=Math.random()*Math.PI*2;
  const d=15+Math.random()*50;
  c.position.set(Math.sin(a)*d,0,Math.cos(a)*d);
});

animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
const gasBtn=document.getElementById("gasBtn");
const leftBtn=document.getElementById("leftBtn");
const rightBtn=document.getElementById("rightBtn");

gasBtn.addEventListener("touchstart",()=>keys["w"]=true);
gasBtn.addEventListener("touchend",()=>keys["w"]=false);

leftBtn.addEventListener("touchstart",()=>keys["a"]=true);
leftBtn.addEventListener("touchend",()=>keys["a"]=false);

rightBtn.addEventListener("touchstart",()=>keys["d"]=true);
rightBtn.addEventListener("touchend",()=>keys["d"]=false);
</script>

  <button id="leftBtn">⬅️</button>
  <button id="gasBtn">⬆️</button>
  <button id="rightBtn">➡️</button>
</div>
